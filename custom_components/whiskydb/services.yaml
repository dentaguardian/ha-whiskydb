add_rack:
  name: Regal hinzufügen
  description: Fügt ein Lagerregal innerhalb einer Sammlung hinzu.
  fields:
    cellar_id:
      description: "ID der Sammlung (optional, Standard: die erste)"
    name:
      description: Name des Regals
      example: "Vitrine Wohnzimmer"
    columns:
      description: Anzahl der Spalten
      example: 6
    shelves:
      description: Anzahl der Regalböden
      example: 3
    levels:
      description: "Übereinanderliegende Ebenen (1 bis 4)"
      example: 1

update_rack:
  name: Regal bearbeiten
  description: Bearbeitet ein vorhandenes Regal.
  fields:
    rack_id:
      description: ID des Regals
      required: true
    name:
      description: Neuer Name
    columns:
      description: Anzahl der Spalten
    shelves:
      description: Anzahl der Regalböden
    levels:
      description: Übereinanderliegende Ebenen (1 bis 4)

remove_rack:
  name: Regal löschen
  description: Löscht ein Regal. Flaschen darin verlieren ihren Lagerplatz, bleiben aber in der Sammlung.
  fields:
    rack_id:
      description: ID des Regals
      required: true

add_cellar:
  name: Sammlung hinzufügen
  description: Legt eine neue, leere Sammlung (Schrank) in der Instanz an.
  fields:
    name:
      description: Name der Sammlung
      example: "Sammlung Büro"

rename_cellar:
  name: Sammlung umbenennen
  description: Benennt eine Sammlung um (die erste, wenn cellar_id weggelassen wird).
  fields:
    cellar_id:
      description: ID der Sammlung (optional)
    name:
      description: Neuer Name
      required: true

remove_cellar:
  name: Sammlung löschen
  description: Löscht eine leere Sammlung (wird abgelehnt, wenn sie Regale enthält oder die letzte ist).
  fields:
    cellar_id:
      description: ID der Sammlung
      required: true

add_whisky:
  name: Whisky hinzufügen
  description: Fügt einen Whisky-Eintrag zur Sammlung hinzu, optional mit erstem Lagerplatz.
  fields:
    name:
      description: Name des Eintrags (z. B. "Lagavulin 16 Years Old")
      required: true
      example: "Lagavulin 16 Years Old"
    rack_id:
      description: ID des Zielregals (optional — ohne Regal werden `quantity` Exemplare ohne Lagerplatz angelegt)
    slot:
      description: Platznummer im Regal (nur wenn rack_id angegeben ist)
      example: 0
    quantity:
      description: Anzahl anzulegender Exemplare, wenn rack_id weggelassen wird (Standard 1)
      example: 1
    initial_status:
      description: "Initialer Status der angelegten Exemplare: sealed, opened oder finished (Standard sealed)"
      example: "sealed"
    distillery:
      description: Destillerie
      example: "Lagavulin"
    bottler:
      description: Unabhängiger Abfüller (falls von der Destillerie abweichend)
    brand:
      description: Handelsmarke
    expression:
      description: 'Expression / Abfüllung (z. B. "16 Year Old")'
    country:
      description: Land
      example: "Schottland"
    region:
      description: Region
      example: "Islay"
    distillery_location:
      description: Genaue Lage der Destillerie
    whisky_type:
      description: "Typ: Single Malt, Blended Malt, Blended Whisky, Single Grain, Bourbon, Rye, Tennessee Whiskey, Corn Whiskey, Irish Single Malt, Irish Pot Still, Japanese Whisky, World Whisky, Sonstige"
      example: "Single Malt"
    age:
      description: Alter (Jahre)
      example: "16"
    vintage:
      description: Destillationsjahr
    bottling_year:
      description: Abfülljahr
    abv:
      description: Alkoholgehalt (% vol)
      example: 43
    volume_ml:
      description: Volumen in Millilitern
      example: 700
    chill_filtered:
      description: Nicht kühlgefiltert = false
    natural_colour:
      description: Natürliche Farbe (ungefärbt) = true
    peated:
      description: Torfig
    peat_level:
      description: "Torfigkeit (z. B. leicht, mittel, stark)"
    ppm:
      description: Phenolgehalt in ppm (falls bekannt)
    maturation:
      description: Zusammenfassung der Reifung
    cask_type:
      description: "Fasstyp (z. B. First Fill Bourbon, Oloroso, PX …)"
    cask_number:
      description: Fassnummer
    finish:
      description: Finish (Fassfinish)
    maturation_years:
      description: Reifedauer in Jahren
    batch:
      description: Chargennummer
    edition:
      description: Edition
    bottle_number:
      description: Flaschennummer (limitierte Edition)
    number_of_bottles:
      description: Gesamtzahl der produzierten Flaschen
    limited_edition:
      description: Limitierte Edition
    independent_bottler:
      description: Unabhängige Abfüllung (außerhalb der Ursprungs-Destillerie)
    tasting_notes:
      description: Allgemeine Verkostungsnotizen
    nose_notes:
      description: Nase
    palate_notes:
      description: Gaumen
    finish_notes:
      description: Abgang
    whiskybase_id:
      description: Whiskybase-ID (optional, wird nie automatisch abgefragt)
    whiskybase_url:
      description: Whiskybase-Link (optional, wird nie automatisch abgefragt)
    image_url:
      description: URL des Fotos
    label_image_url:
      description: URL des Etikettfotos
    price:
      description: Kaufpreis
    current_value:
      description: Aktueller geschätzter Wert
    currency:
      description: Währung (Standard EUR)
    purchase_date:
      description: Kaufdatum (JJJJ-MM-TT)
    purchase_location:
      description: Kaufort
    storage_location:
      description: Freitext-Lagerort (zusätzlich zur Regalplatzierung)
    notes:
      description: Persönliche Notizen
    favorite:
      description: Liebling
    rating:
      description: Persönliche Bewertung /5
    barcode:
      description: Strichcode
    external_id:
      description: Externe ID (andere Datenbank)
    external_url:
      description: Externer Link

update_whisky:
  name: Whisky bearbeiten
  description: Bearbeitet die Informationen eines vorhandenen Whisky-Eintrags (gleiche Felder wie add_whisky, ohne Lagerplatz).
  fields:
    whisky_id:
      description: ID des Whiskys
      required: true
    name:
      description: Neuer Name
    distillery:
      description: Destillerie
    bottler:
      description: Unabhängiger Abfüller
    brand:
      description: Handelsmarke
    expression:
      description: Expression / Abfüllung
    country:
      description: Land
    region:
      description: Region
    whisky_type:
      description: Whisky-Typ
    age:
      description: Alter
    abv:
      description: Alkoholgehalt
    cask_type:
      description: Fasstyp
    finish:
      description: Finish
    tasting_notes:
      description: Verkostungsnotizen
    price:
      description: Kaufpreis
    current_value:
      description: Aktueller geschätzter Wert
    favorite:
      description: Liebling
    rating:
      description: Persönliche Bewertung /5

remove_whisky:
  name: Whisky entfernen
  description: Entfernt einen Whisky-Eintrag mit ALLEN seinen Exemplaren aus der Sammlung.
  fields:
    whisky_id:
      description: ID des Whiskys
      required: true

add_slot:
  name: Exemplar hinzufügen
  description: Fügt einem vorhandenen Whisky eine weitere physische Flasche hinzu.
  fields:
    whisky_id:
      description: ID des Whiskys
      required: true
    rack_id:
      description: ID des Regals
    slot:
      description: Platznummer
    comment:
      description: Freier Kommentar zu diesem Exemplar
    size:
      description: Flaschenformat

update_slot:
  name: Exemplar bearbeiten
  description: Ändert Format oder Kommentar einer physischen Flasche.
  fields:
    whisky_id:
      description: ID des Whiskys
      required: true
    slot_idx:
      description: Index des Exemplars in der Liste der Lagerplätze
      required: true
    size:
      description: Flaschenformat
    comment:
      description: Freier Kommentar

move_slot:
  name: Exemplar verschieben
  description: Verschiebt eine physische Flasche in ein anderes Regal / an einen anderen Platz.
  fields:
    whisky_id:
      description: ID des Whiskys
      required: true
    slot_idx:
      description: Index des zu verschiebenden Exemplars
      required: true
    rack_id:
      description: ID des Zielregals
      required: true
    slot:
      description: Ziel-Platznummer
      required: true

remove_slot:
  name: Exemplar entfernen
  description: >-
    Entfernt EIN Exemplar, ohne seinen Status zu ändern (kein Verbrauchs-Service —
    dafür open_bottle/finish_bottle nutzen). Der Whisky wird automatisch
    mitgelöscht, wenn es sein letztes Exemplar war.
  fields:
    whisky_id:
      description: ID des Whiskys
      required: true
    slot_idx:
      description: Index des zu entfernenden Exemplars
      required: true

open_bottle:
  name: Flasche öffnen
  description: Markiert ein Exemplar als geöffnet (sealed → opened). Löst das Ereignis whiskydb_bottle_opened aus.
  fields:
    whisky_id:
      description: ID des Whiskys
      required: true
    slot_idx:
      description: Index des Exemplars (Standard 0)
      example: 0
    opened_date:
      description: Öffnungsdatum (JJJJ-MM-TT, Standard heute)

finish_bottle:
  name: Flasche leeren
  description: >-
    Markiert ein Exemplar als leer (opened → finished). Der Lagerplatz wird
    NICHT gelöscht: Der Eintrag bleibt mit seinem Verlauf einsehbar.
    Löst das Ereignis whiskydb_bottle_finished aus.
  fields:
    whisky_id:
      description: ID des Whiskys
      required: true
    slot_idx:
      description: Index des Exemplars (Standard 0)
      example: 0
    finished_date:
      description: Endedatum (JJJJ-MM-TT, Standard heute)
    rating:
      description: Persönliche Bewertung /5 für diesen Whisky
    comment:
      description: Verkostungskommentar für dieses Exemplar

update_remaining:
  name: Füllstand aktualisieren
  description: >-
    Aktualisiert den Füllstand (%) eines GEÖFFNETEN Exemplars (manuelle
    Verfolgung, z. B. Wiegen oder Sichtschätzung). Löst das Ereignis
    whiskydb_bottle_low NUR beim erstmaligen Unterschreiten des Schwellwerts
    aus (nicht bei jedem Aufruf) und ist direkt als Automatisierungs-Trigger
    nutzbar.
  fields:
    whisky_id:
      description: ID des Whiskys
      required: true
    slot_idx:
      description: Index des Exemplars (Standard 0)
      example: 0
    remaining_percent:
      description: Füllstand, 0 bis 100
      required: true
      example: 35
    low_threshold:
      description: Schwellwert, dessen Unterschreiten whiskydb_bottle_low auslöst (Standard 20)
      example: 20

add_tasting:
  name: Verkostung hinzufügen (ohne Sammlung)
  description: >-
    Fügt einen Eintrag ins Verkostungstagebuch für einen nur PROBIERTEN Whisky
    (bei Freunden, in der Bar, auf einer Verkostung), ohne je eine Flasche
    besessen zu haben. Hat KEINEN Einfluss auf die Sammlung (Whiskies, Regale,
    Sensoren): Diese Einträge leben in einer separaten Liste und erscheinen
    in der Karte im Tab "🥂 Getrunkene" zusammen mit den geleerten Flaschen.
    Löst das Ereignis whiskydb_tasting_added aus.
  fields:
    name:
      description: Name des verkosteten Whiskys
      required: true
      example: "Talisker 18 Years Old"
    distillery:
      description: Destillerie
    whisky_type:
      description: "Typ: Single Malt, Blended Malt, Blended Whisky, Single Grain, Bourbon, Rye, Tennessee Whiskey, Corn Whiskey, Irish Single Malt, Irish Pot Still, Japanese Whisky, World Whisky, Sonstige"
    region:
      description: Region
    country:
      description: Land
    place:
      description: 'Ort der Verkostung (z. B. "Bei Marc", "Bar Le Malt")'
      example: "Bei Marc"
    tasted_date:
      description: Verkostungsdatum (JJJJ-MM-TT, Standard heute)
    rating:
      description: Persönliche Bewertung /5
    comment:
      description: Verkostungskommentar

remove_tasting:
  name: Verkostung löschen (ohne Sammlung)
  description: Löscht einen Eintrag aus dem Verkostungstagebuch.
  fields:
    tasting_id:
      description: ID des Verkostungseintrags
      required: true
