add_rack:
  name: "Add rack"
  description: "Adds a storage rack within a collection."
  fields:
    cellar_id:
      description: "ID of the collection (optional, defaults to the first)"
    name:
      description: "Rack name"
      example: "Living room display cabinet"
    columns:
      description: "Number of columns"
      example: "6"
    shelves:
      description: "Number of shelves"
      example: "3"
    levels:
      description: "Stacked levels (1 to 4)"
      example: "1"

update_rack:
  name: "Edit rack"
  description: "Edits an existing rack."
  fields:
    rack_id:
      description: "Rack ID"
      required: true
    name:
      description: "New name"
    columns:
      description: "Number of columns"
    shelves:
      description: "Number of shelves"
    levels:
      description: "Stacked levels (1 to 4)"

remove_rack:
  name: "Delete rack"
  description: "Deletes a rack. Bottles in it lose their storage location but stay in the collection."
  fields:
    rack_id:
      description: "Rack ID"
      required: true

add_cellar:
  name: "Add collection"
  description: "Creates a new, empty collection (cabinet) in the instance."
  fields:
    name:
      description: "Collection name"
      example: "Office collection"

rename_cellar:
  name: "Rename collection"
  description: "Renames a collection (the first one if cellar_id is omitted)."
  fields:
    cellar_id:
      description: "ID of the collection (optional)"
    name:
      description: "New name"
      required: true

remove_cellar:
  name: "Delete collection"
  description: "Deletes an empty collection (rejected if it contains racks or is the last one)."
  fields:
    cellar_id:
      description: "ID of the collection"
      required: true

add_whisky:
  name: "Add whisky"
  description: "Adds a whisky record to the collection, optionally with its first storage slot."
  fields:
    name:
      description: "Record name (e.g. \"Lagavulin 16 Years Old\")"
      required: true
      example: "Lagavulin 16 Years Old"
    rack_id:
      description: "ID of the target rack (optional — without a rack, `quantity` bottles are created without a storage location)"
    slot:
      description: "Slot number in the rack (only if rack_id is given)"
      example: "0"
    quantity:
      description: "Number of bottles to create when rack_id is omitted (default 1)"
      example: "1"
    initial_status:
      description: "Initial status of the created bottles: sealed, opened or finished (default sealed)"
      example: "sealed"
    distillery:
      description: "Distillery"
      example: "Lagavulin"
    bottler:
      description: "Independent bottler (if different from the distillery)"
    brand:
      description: "Commercial brand"
    expression:
      description: "Expression / bottling (e.g. \"16 Year Old\")"
    country:
      description: "Country"
      example: "Scotland"
    region:
      description: "Region"
      example: "Islay"
    distillery_location:
      description: "Exact location of the distillery"
    whisky_type:
      description: "Type: Single Malt, Blended Malt, Blended Whisky, Single Grain, Bourbon, Rye, Tennessee Whiskey, Corn Whiskey, Irish Single Malt, Irish Pot Still, Japanese Whisky, World Whisky, Other"
      example: "Single Malt"
    age:
      description: "Age (years)"
      example: "16"
    vintage:
      description: "Distillation year"
    bottling_year:
      description: "Bottling year"
    abv:
      description: "Alcohol by volume (%)"
      example: "43"
    volume_ml:
      description: "Volume in millilitres"
      example: "700"
    chill_filtered:
      description: "Not chill-filtered = false"
    natural_colour:
      description: "Natural colour (uncoloured) = true"
    peated:
      description: "Peated"
    peat_level:
      description: "Peat level (e.g. light, medium, strong)"
    ppm:
      description: "Phenol content in ppm (if known)"
    maturation:
      description: "Summary of the maturation"
    cask_type:
      description: "Cask type (e.g. First Fill Bourbon, Oloroso, PX …)"
    cask_number:
      description: "Cask number"
    finish:
      description: "Finish"
    maturation_years:
      description: "Maturation period in years"
    batch:
      description: "Batch number"
    edition:
      description: "Edition"
    bottle_number:
      description: "Bottle number (limited edition)"
    number_of_bottles:
      description: "Total number of bottles produced"
    limited_edition:
      description: "Limited edition"
    independent_bottler:
      description: "Independent bottling (outside the original distillery)"
    tasting_notes:
      description: "General tasting notes"
    nose_notes:
      description: "Nose"
    palate_notes:
      description: "Palate"
    finish_notes:
      description: "Finish"
    whiskybase_id:
      description: "Whiskybase ID (optional, never queried automatically)"
    whiskybase_url:
      description: "Whiskybase link (optional, never queried automatically)"
    image_url:
      description: "Photo URL"
    label_image_url:
      description: "Label photo URL"
    price:
      description: "Purchase price"
    current_value:
      description: "Current estimated value"
    currency:
      description: "Currency (default EUR)"
    purchase_date:
      description: "Purchase date (YYYY-MM-DD)"
    purchase_location:
      description: "Place of purchase"
    storage_location:
      description: "Free-text storage location (in addition to the rack slot)"
    notes:
      description: "Personal notes"
    favorite:
      description: "Favourite"
    rating:
      description: "Personal rating /5"
    barcode:
      description: "Barcode"
    external_id:
      description: "External ID (other database)"
    external_url:
      description: "External link"

update_whisky:
  name: "Edit whisky"
  description: "Edits the information of an existing whisky record (same fields as add_whisky, without storage slot)."
  fields:
    whisky_id:
      description: "Whisky ID"
      required: true
    name:
      description: "New name"
    distillery:
      description: "Distillery"
    bottler:
      description: "Independent bottler"
    brand:
      description: "Commercial brand"
    expression:
      description: "Expression / bottling"
    country:
      description: "Country"
    region:
      description: "Region"
    whisky_type:
      description: "Whisky type"
    age:
      description: "Age"
    abv:
      description: "Alcohol by volume"
    cask_type:
      description: "Cask type"
    finish:
      description: "Finish"
    tasting_notes:
      description: "Tasting notes"
    price:
      description: "Purchase price"
    current_value:
      description: "Current estimated value"
    favorite:
      description: "Favourite"
    rating:
      description: "Personal rating /5"

remove_whisky:
  name: "Remove whisky"
  description: "Removes a whisky record and ALL of its bottles from the collection."
  fields:
    whisky_id:
      description: "Whisky ID"
      required: true

add_slot:
  name: "Add bottle"
  description: "Adds another physical bottle to an existing whisky."
  fields:
    whisky_id:
      description: "Whisky ID"
      required: true
    rack_id:
      description: "Rack ID"
    slot:
      description: "Slot number"
    comment:
      description: "Free comment for this bottle"
    size:
      description: "Bottle format"

update_slot:
  name: "Edit bottle"
  description: "Changes format or comment of a physical bottle."
  fields:
    whisky_id:
      description: "Whisky ID"
      required: true
    slot_idx:
      description: "Index of the bottle in the list of storage slots"
      required: true
    size:
      description: "Bottle format"
    comment:
      description: "Free comment"

move_slot:
  name: "Move bottle"
  description: "Moves a physical bottle to another rack / slot."
  fields:
    whisky_id:
      description: "Whisky ID"
      required: true
    slot_idx:
      description: "Index of the bottle to move"
      required: true
    rack_id:
      description: "ID of the target rack"
      required: true
    slot:
      description: "Target slot number"
      required: true

remove_slot:
  name: "Remove bottle"
  description: "Removes ONE bottle without changing its status (not a consumption service — use open_bottle/finish_bottle for that). The whisky is deleted along with it automatically if this was its last bottle."
  fields:
    whisky_id:
      description: "Whisky ID"
      required: true
    slot_idx:
      description: "Index of the bottle to remove"
      required: true

open_bottle:
  name: "Open bottle"
  description: "Marks a bottle as opened (sealed → opened). Fires the whiskydb_bottle_opened event."
  fields:
    whisky_id:
      description: "Whisky ID"
      required: true
    slot_idx:
      description: "Index of the bottle (default 0)"
      example: "0"
    opened_date:
      description: "Opening date (YYYY-MM-DD, default today)"

finish_bottle:
  name: "Finish bottle"
  description: "Marks a bottle as finished (opened → finished). The storage slot is NOT deleted: the record stays viewable with its history. Fires the whiskydb_bottle_finished event."
  fields:
    whisky_id:
      description: "Whisky ID"
      required: true
    slot_idx:
      description: "Index of the bottle (default 0)"
      example: "0"
    finished_date:
      description: "End date (YYYY-MM-DD, default today)"
    rating:
      description: "Personal rating /5 for this whisky"
    comment:
      description: "Tasting comment for this bottle"

update_remaining:
  name: "Update fill level"
  description: "Updates the fill level (%) of an OPENED bottle (manual tracking, e.g. weighing or visual estimation). Fires the whiskydb_bottle_low event ONLY when the threshold is crossed for the first time (not on every call) and can be used directly as an automation trigger."
  fields:
    whisky_id:
      description: "Whisky ID"
      required: true
    slot_idx:
      description: "Index of the bottle (default 0)"
      example: "0"
    remaining_percent:
      description: "Fill level, 0 to 100"
      required: true
      example: "35"
    low_threshold:
      description: "Threshold below which whiskydb_bottle_low fires (default 20)"
      example: "20"

add_tasting:
  name: "Add tasting (outside the collection)"
  description: "Adds an entry to the tasting diary for a whisky you only TASTED (at friends', in a bar, at a tasting) without ever owning a bottle. Has NO effect on the collection (whiskies, racks, sensors): these entries live in a separate list and appear in the card's \"🥂\" tab together with the finished bottles. Fires the whiskydb_tasting_added event."
  fields:
    name:
      description: "Name of the tasted whisky"
      required: true
      example: "Talisker 18 Years Old"
    distillery:
      description: "Distillery"
    whisky_type:
      description: "Type: Single Malt, Blended Malt, Blended Whisky, Single Grain, Bourbon, Rye, Tennessee Whiskey, Corn Whiskey, Irish Single Malt, Irish Pot Still, Japanese Whisky, World Whisky, Other"
    region:
      description: "Region"
    country:
      description: "Country"
    place:
      description: "Place of tasting (e.g. \"At Marc's\", \"Le Malt bar\")"
      example: "At Marc's"
    tasted_date:
      description: "Tasting date (YYYY-MM-DD, default today)"
    rating:
      description: "Personal rating /5"
    comment:
      description: "Tasting comment"

remove_tasting:
  name: "Delete tasting (outside the collection)"
  description: "Deletes an entry from the tasting diary."
  fields:
    tasting_id:
      description: "ID of the tasting entry"
      required: true
